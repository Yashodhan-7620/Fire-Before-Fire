name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install fastapi uvicorn pydantic pandas pyarrow scikit-learn mlflow requests

      - name: Lint
        run: flake8 src --max-line-length=110 --extend-ignore=E203

      - name: Run tests
        run: pytest -q

  cd:
    name: Build local deployment image
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.api -t fire-anomaly-mlops:${{ github.sha }} .

      # Deployment target for this project is LOCAL only (docker compose
      # on your own machine) -- CD here stops at "image builds cleanly
      # and is tagged," it does not push to any cloud registry or
      # deploy anywhere. To go further, add a `docker push` step with
      # registry credentials in repo secrets.
      - name: Confirm image built
        run: docker images fire-anomaly-mlops
